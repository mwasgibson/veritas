<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Veritas extension options</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 2rem auto; padding: 0 1rem; background: #0a0a0a; color: #e5e5e5; }
    input { width: 100%; padding: 0.5rem; margin: 0.5rem 0 1rem; background: #171717; border: 1px solid #404040; color: #fff; border-radius: 6px; }
    button { padding: 0.5rem 1rem; border: none; border-radius: 6px; background: #f5f5f5; color: #0a0a0a; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Veritas extension</h1>
  <p>Only the search query is sent to your local SPA via <code>?q=</code>.</p>
  <label for="origin">SPA origin</label>
  <input id="origin" type="url" />
  <button id="save" type="button">Save</button>
  <p id="status"></p>
  <script src="popup.js"></script>
</body>
</html>
